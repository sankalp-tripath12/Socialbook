<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Book - Settings</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        
        body.dark-mode {
            background-color: #18191a;
            color: #e4e6eb;
        }
        body.dark-mode .card {
            background-color: #242526;
        }
        body.dark-mode input, 
        body.dark-mode select, 
        body.dark-mode button {
            background-color: #3a3b3c;
            color: #fff;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">SocialBook</div>
        <nav class="top-nav">
            <a href="index.html">Home</a>
            <a href="feed.html">Feed</a>
            <a href="profile.html">Profile</a>
            <a href="friends.html">Friends</a>
            <a href="messages.html">Messages</a>
            <a href="settings.html">Settings</a>
        </nav>
    </header>

    <main class="page-wrapper">
        <section class="card">
            <h2>Settings</h2>

            <h3>Account</h3>
            <label>Email</label>
            <input type="email" value="sankalp123@gmail.com">

            <label>Change Password</label>
            <input type="password" placeholder="New password">

            <h3>Privacy</h3>
            <label>Who can see your posts?</label>
            <select>
                <option>Public</option>
                <option>Friends</option>
                <option>Only me</option>
            </select>

            <h3>Theme</h3>
            <button id="darkModeBtn">Toggle Dark Mode</button>
        </section>
    </main>

    <footer class="footer">
        <p>2025 SocialBook - A simple Facebook-style project by [Sankalp Tripathi]</p>
    </footer>

 
    <script>
        const darkModeBtn = document.getElementById('darkModeBtn');
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
